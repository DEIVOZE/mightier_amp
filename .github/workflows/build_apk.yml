name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix hardcoded Java path in gradle.properties
        run: sed -i '/org.gradle.java.home/d' android/gradle.properties

      - name: Проверка анализатором
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/bluetooth/devices/presets/ai_json_bridge.dart lib/UI/pages/settings.dart

      # Ключ генерируется один раз и сохраняется в base64, чтобы все
      # последующие сборки подписывались одним и тем же ключом.
      - name: Prepare persistent signing key
        id: keystore
        shell: bash
        run: |
          if [ -f keystore.b64 ]; then
            echo "Existing keystore.b64 found."
            echo "KEY_SAVED=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Generating new keystore..."
          keytool -genkeypair \
            -keystore mightier.keystore \
            -storetype PKCS12 \
            -alias mightier \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mightieramp \
            -keypass mightieramp \
            -dname "CN=Mightier Amp AI, OU=Release, O=Mightier Amp AI, L=NA, S=NA, C=NA"

          base64 -w 0 mightier.keystore > keystore.b64
          rm -f mightier.keystore

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore.b64
          git commit -m "chore: add persistent release keystore [skip ci]"
          git push origin HEAD

          echo "Keystore generated and saved."
          echo "KEY_SAVED=1" >> "$GITHUB_OUTPUT"

      - name: Restore keystore and configure Gradle signing
        if: steps.keystore.outputs.KEY_SAVED == '1'
        shell: bash
        run: |
          base64 -d keystore.b64 > android/app/mightier.keystore
          cat << 'EOF' > android/key.properties
          storePassword=mightieramp
          keyPassword=mightieramp
          keyAlias=mightier
          storeFile=mightier.keystore
          EOF

      - name: Build release APK
        if: steps.keystore.outputs.KEY_SAVED == '1'
        shell: bash
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }}

          SIGNED=build/app/outputs/flutter-apk/app-release.apk
          OUT=build/app/outputs/flutter-apk/MightierAmp-AI.apk
          cp "$SIGNED" "$OUT"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"

          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: steps.keystore.outputs.KEY_SAVED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: MightierAmp-AI-${{ github.run_number }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish release
        if: steps.keystore.outputs.KEY_SAVED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mightier Amp AI build ${{ github.run_number }}
          files: ${{ env.APK }}
          generate_release_notes: true
          fail_on_unmatched_files: true
